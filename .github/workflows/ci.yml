name: Java CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run tests
        run: bash ./mvnw test

      - name: Build project
        run: bash ./mvnw clean package -DskipTests

      - name: Smoke test startup and health endpoint
        run: |
          export SPRING_PROFILES_ACTIVE=test
          export SERVER_PORT=8082
          export MANAGEMENT_PORT=8082
          bash ./mvnw spring-boot:run > app.log 2>&1 &
          APP_PID=$!

          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8082/actuator/health > health.json; then
              echo "Application health check passed"
              cat health.json
              break
            fi
            sleep 2
          done

          if [ ! -s health.json ]; then
            echo "Health check failed"
            cat app.log
            exit 1
          fi

          kill $APP_PID || true
          wait $APP_PID || true

      - name: Validate Docker image builds
        run: docker build -t helpdesk-backend:ci .
