spring.datasource.url=${DB_URL:${MYSQL_URL:${SPRING_DATASOURCE_URL:}}}
spring.datasource.username=${DB_USERNAME:${MYSQLUSER:${SPRING_DATASOURCE_USERNAME:}}}
spring.datasource.password=${DB_PASSWORD:${MYSQLPASSWORD:${SPRING_DATASOURCE_PASSWORD:}}}

spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

management.health.mail.enabled=false
app.bootstrap.admin.enabled=${APP_BOOTSTRAP_ADMIN_ENABLED:true}

logging.level.root=INFO
logging.level.org.springframework.security=INFO
logging.level.com.example.helpdesk_backend=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n

server.tomcat.accept-count=100
server.tomcat.max-connections=200
server.tomcat.max-threads=200
server.forward-headers-strategy=native
server.tomcat.remoteip.internal-proxies=${TOMCAT_INTERNAL_PROXIES:10\\.\\d{1,3}\\.\\d{1,3}\\.\\d{1,3}|192\\.168\\.\\d{1,3}\\.\\d{1,3}|169\\.254\\.\\d{1,3}\\.\\d{1,3}|127\\.\\d{1,3}\\.\\d{1,3}\\.\\d{1,3}|172\\.(1[6-9]|2[0-9]|3[0-1])\\.\\d{1,3}\\.\\d{1,3}|0:0:0:0:0:0:0:1|::1}
server.ssl.enabled=${SSL_ENABLED:false}

management.endpoint.health.show-details=when-authorized
management.endpoints.web.exposure.include=health,info,prometheus

# Production-safe defaults
app.jwt.secret=${JWT_SECRET}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.leak-detection-threshold=20000
