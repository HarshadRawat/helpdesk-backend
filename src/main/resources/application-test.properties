# Test profile
spring.datasource.url=jdbc:h2:mem:helpdesk_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

spring.flyway.enabled=false

management.health.mail.enabled=false
app.bootstrap.admin.enabled=false

logging.level.root=WARN
logging.level.org.springframework.security=INFO
logging.level.com.example.helpdesk_backend=INFO

app.jwt.secret=test-secret-key-that-is-at-least-32-characters-long!
app.jwt.access-expiration-ms=3600000
app.jwt.refresh-expiration-ms=604800000
app.rate-limit.max-requests=1000
app.rate-limit.window-seconds=60
app.storage.upload-dir=./target/test-uploads
