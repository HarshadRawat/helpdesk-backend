spring.datasource.url=${DEV_DB_URL:jdbc:h2:mem:helpdesk_dev;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DEV_DB_USERNAME:sa}
spring.datasource.password=${DEV_DB_PASSWORD:}
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.flyway.enabled=false

app.bootstrap.admin.enabled=true
app.bootstrap.admin.name=Admin User
app.bootstrap.admin.email=admin@example.com
app.bootstrap.admin.password=Admin@123

logging.level.root=INFO
logging.level.org.springframework.security=INFO
logging.level.com.example.helpdesk_backend=INFO

app.jwt.secret=dev-local-secret-key-that-is-at-least-32-characters-long!
