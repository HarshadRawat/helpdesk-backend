services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: helpdesk-backend
    restart: on-failure
    ports:
      - "18080:8080"
      - "18081:8081"
    environment:
      SERVER_PORT: 8080
      DB_URL: jdbc:mysql://mysql:3306/helpdesk_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: root
      DB_PASSWORD: change-me
      JWT_SECRET: ${JWT_SECRET:?Please set JWT_SECRET in .env file}
      AUDIT_RETENTION_DAYS: 90
      UPLOAD_DIR: /app/uploads
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      APP_BOOTSTRAP_ADMIN_ENABLED: "false"
      APP_BOOTSTRAP_ADMIN_NAME: Admin
      APP_BOOTSTRAP_ADMIN_EMAIL: admin@localhost
      APP_BOOTSTRAP_ADMIN_PASSWORD: change-me-admin-password
      SPRING_PROFILES_ACTIVE: prod
      SERVER_FORWARD_HEADERS_STRATEGY: native
    volumes:
      - uploads-data:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
      mailpit:
        condition: service_started

  nginx:
    image: nginx:stable-alpine
    container_name: helpdesk-proxy
    depends_on:
      - app
    ports:
      - "18088:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

  mysql:
    image: mysql:8.0
    container_name: helpdesk-mysql
    restart: always
    environment:
      MYSQL_DATABASE: helpdesk_db
      MYSQL_ROOT_PASSWORD: change-me
    ports:
      - "33306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pchange-me"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    volumes:
      - mysql-data:/var/lib/mysql

  mailpit:
    image: axllent/mailpit:latest
    container_name: helpdesk-mailpit
    restart: always
    ports:
      - "18025:8025"
      - "11025:1025"

volumes:
  mysql-data:
  uploads-data:
